# Smithery.ai configuration for VeriScope MCP Server
name: "veriscope-mcp"
description: "Cryptographic Bibliographic Index & Fair-Use Citation Verification Engine for AI Agents"
version: "1.1.7"
runtime: "node"
command: "npx"
args:
  - "-y"
  - "veriscope-mcp"

configSchema:
  type: "object"
  properties:
    veriscopeApiKey:
      type: "string"
      description: "Optional VeriScope Sovereign API Key. If omitted, the server runs offline against the built-in 50-canon golden sandbox with zero configuration."
  required: []
